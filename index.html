<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>我的第一個 AI 網站</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5f8;
      color: #222;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: 100px auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 42px;
    }

    p {
      font-size: 20px;
      line-height: 1.7;
    }

    button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: #238636;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #1a6e2b;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>我的第一個 AI 網站</h1>

    <p>
      你好！這是我第一次建立的網站。<br>
      我正在學習 GitHub 和網頁製作。
    </p>

    <button onclick="showMessage()">認識我</button>
  </main>

  <script>
    function showMessage() {
      alert("很高興認識你！謝謝你來到我的網站 😊");
    }
  </script>
</body>
</html>
